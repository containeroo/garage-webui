---
project_name: garage-webui
version: 2

before:
  hooks:
    - go mod tidy
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - id: garage-webui
    main: ./cmd/garage-webui/
    binary: garage-webui
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Tag }}
      - -X main.commit={{ .FullCommit }}

dockers_v2:
  - id: garage-webui
    ids:
      - garage-webui
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.description: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/containeroo/garage-webui"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.url: "https://github.com/containeroo/garage-webui"
      org.opencontainers.image.version: "{{ .Tag }}"
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/containeroo/garage-webui
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
