---
apiVersion: v1
kind: Service
metadata:
  name: garage-postgres
spec:
  selector:
    app: garage-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage-postgres
spec:
  serviceName: garage-postgres
  replicas: 1
  selector:
    matchLabels:
      app: garage-postgres
  template:
    metadata:
      labels:
        app: garage-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: garage_webui
            - name: POSTGRES_USER
              value: garage_webui
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: garage-webui-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                ["pg_isready", "-U", "garage_webui", "-d", "garage_webui"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
