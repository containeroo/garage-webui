services:
  postgres:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: garage_webui
      POSTGRES_USER: garage_webui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage_webui -d garage_webui"]
      interval: 5s
      timeout: 3s
      retries: 12

  webui:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GARAGE_WEBUI__DATABASE_URL: postgres://garage_webui:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/garage_webui?sslmode=disable

volumes:
  postgres-data:
